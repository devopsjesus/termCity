name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  csharp:
    name: C# (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test TermCity.slnx -c Release

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - if: runner.os == 'Linux'
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - if: runner.os == 'Linux'
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --workspace --all-features
      - run: cargo build --manifest-path rust/Cargo.toml --workspace --release
